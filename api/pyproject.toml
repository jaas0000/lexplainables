[project]
name = "wetsanalyse-api"
version = "0.1.0"
description = "Referentie-implementatie: het feedback-domein, contract-first + vertical slicing."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "sqlalchemy[asyncio]>=2.0",
    "sqlmodel>=0.0.21",
    "pydantic>=2.9",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "uvicorn[standard]>=0.30",
    "bcrypt>=4.0",
    "cryptography>=42.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx2>=0.28",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"**/router.py" = ["B008"]  # FastAPI's Depends()-in-default is het idiomatische patroon, geen bug
"**/auth.py" = ["B008"]    # idem voor gedeelde auth-dependencies
