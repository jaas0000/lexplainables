[project]
name = "wetsanalyse-api"
version = "0.1.0"
description = "Referentie-implementatie: het feedback-domein, contract-first + vertical slicing."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "sqlalchemy[asyncio]>=2.0",
    "sqlmodel>=0.0.21",
    "pydantic>=2.9",
    # DB-drivers: asyncpg voor productie (runtime); psycopg2-binary voor Alembic
    # (sync-migraties). Uitsluitend Postgres — zie ADR-0003.
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "uvicorn[standard]>=0.30",
    "bcrypt>=4.0",
    "cryptography>=42.0",
    "httpx>=0.27",
    "litellm>=1.40",
]

[project.optional-dependencies]
# OpenTelemetry-stack: optioneel (project-ADR-0006). Zonder deze extra draaien logging en
# request-middleware gewoon; get_tracer()/get_meter() geven no-op-shims terug. Installeer
# alleen in de productie-image (Dockerfile: `uv sync --extra otel`) en waar je écht traces
# naar een collector wilt sturen.
otel = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "opentelemetry-instrumentation-asyncpg>=0.48b0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx2>=0.28",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"**/router.py" = ["B008"]  # FastAPI's Depends()-in-default is het idiomatische patroon, geen bug
"**/auth.py" = ["B008"]    # idem voor gedeelde auth-dependencies
