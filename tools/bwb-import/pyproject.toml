[project]
name = "bwb-import"
version = "0.1.0"
description = "ETL voor het Basiswettenbestand (BWB) naar GraphDB (RDF/SPARQL)."
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "lxml>=5.3",
    "rdflib>=7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests die een echte GraphDB-instance vereisen (standaard geskipt, zie CI: -m 'not integration')",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
