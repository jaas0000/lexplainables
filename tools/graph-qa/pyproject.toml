[project]
name = "graph-qa"
version = "0.1.0"
description = "Juridische vraagbeantwoording via GraphDB-graaf (MCP)."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "anthropic>=1.0.0",
    "httpx>=0.27",
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.1",
    "langgraph-checkpoint-postgres>=3.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# De code leeft in agent/ + api/ (geen graph_qa/-map), dus hatchling expliciet vertellen welke
# packages in de wheel horen — anders faalt `uv sync` (kan geen files bepalen).
[tool.hatch.build.targets.wheel]
packages = ["agent", "api"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: tests die een echte GraphDB-MCP- of LLM-provider vereisen (standaard geskipt)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"api/main.py" = ["B008"]  # FastAPI's Depends()-in-default is het idiomatische patroon, geen bug
