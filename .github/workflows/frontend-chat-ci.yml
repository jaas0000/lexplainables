name: frontend-chat-ci

# Eén workflow per service (werkwijze-ADR-0016) — triggert op wijzigingen binnen frontend-chat/
# en api/ (de contractgeneratie-check en de E2E-login-test hebben een draaiende `api` nodig).
# Geen graph-qa/GraphDB/Foundry in deze workflow: de chat-interactie zelf mockt `POST /api/chat`
# in de E2E-test (zie tests/e2e/chat.spec.ts) — die keten is niet live beschikbaar in CI, zie
# story 056 §Verificatie.
on:
  pull_request:
    paths:
      - "frontend-chat/**"
      - "api/**"
      - ".github/workflows/frontend-chat-ci.yml"
  push:
    branches: [master, main]
    paths:
      - "frontend-chat/**"
      - "api/**"
      - ".github/workflows/frontend-chat-ci.yml"

jobs:
  check-ts-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend-chat/package-lock.json
      - name: npm ci
        working-directory: frontend-chat
        run: npm ci
      - name: eslint + prettier
        working-directory: frontend-chat
        run: |
          npx eslint .
          npm run format:check

  check-generated-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend-chat/package-lock.json
      - name: api genereer-types.sh
        working-directory: api
        run: |
          uv sync
          bash scripts/genereer-types.sh
      - name: frontend-chat genereer-types.sh
        working-directory: frontend-chat
        run: |
          npm ci
          bash scripts/genereer-types.sh
      - name: Geen diff toegestaan op gegenereerde bestanden
        run: git diff --exit-code -- api/generated frontend-chat/generated

  build-frontend-chat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend-chat/package-lock.json
      - name: npm ci
        working-directory: frontend-chat
        run: npm ci
      - name: build
        working-directory: frontend-chat
        run: npm run build

  test-frontend-chat-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lex
          POSTGRES_PASSWORD: lex
          POSTGRES_DB: lex
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U lex -d lex"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      DATABASE_URL: "postgresql+asyncpg://lex:lex@localhost:5432/lex"
      DATABASE_URL_SYNC: "postgresql://lex:lex@localhost:5432/lex"
      API_TOKEN: "ci-api-token-test"
      AUTH_SECRET: "ci-auth-secret-minstens-32-tekens-lang!"
      API_BASE_URL: "http://localhost:8000"
      LOGIN_RATE_LIMIT_MAX: "0"
      FERNET_KEY_FILE: "/tmp/fernet_key"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend-chat/package-lock.json

      - name: API en frontend-chat parallel opzetten en starten
        run: |
          echo -n "sPQtLXlYFB2Zn9lVJv1wTIY_MYh_gBpvMh_p7hUpiL8=" > /tmp/fernet_key
          (
            cd api
            uv sync
            uv run alembic upgrade head
            PYTHONPATH=. uv run python scripts/seed_dev_gebruiker.py
            uv run uvicorn app.main:app --port 8000 > /tmp/api.log 2>&1 &
            for i in $(seq 1 30); do
              curl -sf http://localhost:8000/health > /dev/null && exit 0
              sleep 1
            done
            echo "API niet op tijd gestart"; cat /tmp/api.log; exit 1
          ) &
          api_pid=$!

          (
            cd frontend-chat
            npm ci
            npm run build
            npm run start > /tmp/frontend-chat.log 2>&1 &
            for i in $(seq 1 30); do
              curl -sf http://localhost:3002/ > /dev/null && exit 0
              sleep 1
            done
            echo "frontend-chat niet op tijd gestart"; cat /tmp/frontend-chat.log; exit 1
          ) &
          frontend_chat_pid=$!

          wait "$api_pid"
          wait "$frontend_chat_pid"

      - name: Playwright-browsers installeren
        working-directory: frontend-chat
        run: npx playwright install --with-deps chromium

      - name: E2E-tests
        working-directory: frontend-chat
        run: npm run test:e2e

      - name: Logs bij falen
        if: failure()
        run: |
          echo "--- api.log ---"; cat /tmp/api.log || true
          echo "--- frontend-chat.log ---"; cat /tmp/frontend-chat.log || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend-chat/playwright-report/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: frontend-chat/test-results/
          retention-days: 7
          if-no-files-found: ignore
