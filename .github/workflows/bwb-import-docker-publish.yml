name: bwb-import-docker-publish

# Bouwt en publiceert de bwb-import-image naar GHCR (ADR-0007: elke service publiceert uit
# dezelfde images, gepulled door zowel Azure Container Apps als Portainer). Alleen op push naar
# master — niet op PR's, want dat zou ongeteste code publiceren onder :latest.
on:
  push:
    branches: [master, main]
    paths:
      - "tools/bwb-import/**"
      - ".github/workflows/bwb-import-docker-publish.yml"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/bwb-import/Dockerfile
          push: false
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/bwb-import:${{ github.sha }}

      # Trivy-gate (matcht wetsanalyse-ai's graph-qa-docker-publish.yml): CRITICAL/HIGH
      # kwetsbaarheden in de image blokkeren de publish, in plaats van ze pas bij een
      # productie-incident te ontdekken.
      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/bwb-import:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Push image
        run: |
          docker tag ghcr.io/${{ github.repository_owner }}/bwb-import:${{ github.sha }} \
            ghcr.io/${{ github.repository_owner }}/bwb-import:latest
          docker push ghcr.io/${{ github.repository_owner }}/bwb-import:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/bwb-import:latest
