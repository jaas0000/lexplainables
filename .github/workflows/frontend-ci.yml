name: frontend-ci

# Eén workflow per service (werkwijze-ADR-0016) — triggert alleen op wijzigingen binnen
# frontend/ (en api/, want de contractgeneratie-check en de E2E-test hebben een draaiende
# `api` nodig — dat maakt deze workflow geen gedeelde matrix, alleen een afhankelijkheid).
on:
  pull_request:
    paths:
      - "frontend/**"
      - "api/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches: [master, main]
    paths:
      - "frontend/**"
      - "api/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  check-ts-style:
    # Zie werkwijze-ADR-0003: eslint + prettier voor TypeScript-services.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        working-directory: frontend
        run: npm ci
      - name: eslint + prettier
        working-directory: frontend
        run: |
          npx eslint .
          npm run format:check

  check-generated-types:
    # Zie werkwijze-ADR-0011/0017: de gegenereerde types moeten overeenkomen met api's
    # OpenAPI-schema. Draait beide generatiescripts opnieuw en faalt op een diff — een
    # verouderd gegenereerd bestand toont zich hier, niet pas bij een runtime-fout.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: api genereer-types.sh
        working-directory: api
        run: |
          uv sync
          bash scripts/genereer-types.sh
      - name: frontend genereer-types.sh
        working-directory: frontend
        run: |
          npm ci
          bash scripts/genereer-types.sh
      - name: Geen diff toegestaan op gegenereerde bestanden
        run: git diff --exit-code -- api/generated frontend/generated

  build-frontend:
    # De "testrun" van deze service (ADR-0016 stap 3): tsc + Next-build faalt op een
    # typefout of een build-fout, deze service heeft geen apart unit-testframework.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        working-directory: frontend
        run: npm ci
      - name: build
        working-directory: frontend
        run: npm run build

  test-frontend-e2e:
    # ADR-0016 stap 4: deze service bedient een frontend, dus hoort de Playwright-E2E-test
    # hier te draaien — met de API én de frontend-devserver allebei opgestart in deze job
    # (frontend-bouwen regel 6b), geen `webServer`-config in playwright.config.ts. De API
    # praat Postgres (ADR-0003) — een Postgres-service komt naast de api op.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lex
          POSTGRES_PASSWORD: lex
          POSTGRES_DB: lex
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U lex -d lex"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      DATABASE_URL: "postgresql+asyncpg://lex:lex@localhost:5432/lex"
      DATABASE_URL_SYNC: "postgresql://lex:lex@localhost:5432/lex"
      API_TOKEN: "ci-api-token-test"
      AUTH_SECRET: "ci-auth-secret-minstens-32-tekens-lang!"
      API_BASE_URL: "http://localhost:8000"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: API en frontend parallel opzetten en starten
        run: |
          (
            cd api
            uv sync
            uv run alembic upgrade head
            PYTHONPATH=. uv run python scripts/seed_dev_gebruiker.py
            uv run uvicorn app.main:app --port 8000 > /tmp/api.log 2>&1 &
            for i in $(seq 1 30); do
              curl -sf http://localhost:8000/health > /dev/null && exit 0
              sleep 1
            done
            echo "API niet op tijd gestart"; cat /tmp/api.log; exit 1
          ) &
          api_pid=$!

          (
            cd frontend
            npm ci
            npm run build
            npm run start > /tmp/frontend.log 2>&1 &
            for i in $(seq 1 30); do
              curl -sf http://localhost:3001/ > /dev/null && exit 0
              sleep 1
            done
            echo "Frontend niet op tijd gestart"; cat /tmp/frontend.log; exit 1
          ) &
          frontend_pid=$!

          wait "$api_pid"
          wait "$frontend_pid"

      - name: Playwright-browsers installeren
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: E2E-tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Logs bij falen
        if: failure()
        run: |
          echo "--- api.log ---"; cat /tmp/api.log || true
          echo "--- frontend.log ---"; cat /tmp/frontend.log || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
