name: api-ci

# Eén workflow per service (werkwijze-ADR-0016) — triggert alleen op wijzigingen binnen api/,
# zodat een toekomstige service (frontend/, tools/*) zijn eigen, onafhankelijke CI krijgt in
# plaats van deze workflow te delen.
on:
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/api-ci.yml"
  push:
    branches: [master, main]
    paths:
      - "api/**"
      - ".github/workflows/api-ci.yml"

jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Tests
        working-directory: api
        run: |
          uv sync
          uv run pytest -q

  check-python-style:
    # Zie werkwijze-ADR-0003. --no-project + --with ruff installeert alleen ruff (geverifieerd:
    # 1 pakket i.p.v. de volledige projectomgeving) — zonder --no-project synct `uv run` eerst
    # gewoon de hele projectomgeving, --with voegt dan alleen iets toe aan die sync.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: ruff
        working-directory: api
        run: |
          uv run --no-project --with ruff ruff check .
          uv run --no-project --with ruff ruff format --check .

  check-migraties:
    # Alembic is verplicht zodra een service een productiedatabase heeft (werkwijze-ADR-0005).
    # Draai de volledige historie heen én terug tegen beide dialecten (project-ADR-0003:
    # Postgres in productie, SQLite in tests). Elke migratie moet cleanroom toepasbaar zijn op
    # allebei — anders faalt hier, niet pas bij een echte deploy.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dialect: sqlite
            url_sync: "sqlite:///./ci-migratie-check.db"
          - dialect: postgres
            url_sync: "postgresql://lex:lex@localhost:5432/lex"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lex
          POSTGRES_PASSWORD: lex
          POSTGRES_DB: lex
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U lex -d lex"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: alembic upgrade + downgrade (${{ matrix.dialect }})
        working-directory: api
        env:
          # env.py leest DATABASE_URL_SYNC (sync driver — psycopg2 voor Postgres, plain sqlite
          # voor SQLite) — zie api/alembic/env.py.
          DATABASE_URL_SYNC: ${{ matrix.url_sync }}
        run: |
          uv sync
          uv run alembic upgrade head
          uv run alembic downgrade base
