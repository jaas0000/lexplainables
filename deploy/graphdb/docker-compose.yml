# GraphDB — de BWB-kennisgraaf.
#
# Lokale ontwikkelvariant van wetsanalyse-ai's deploy/graphdb-stack (zie ADR: dit is een
# Portainer-stack, geen Azure Container Apps-target — GraphDB's opslaglaag gebruikt
# geheugen-gemapte bestanden en file-locking, dus productie draait op lokale disk van de
# docker-host, niet op netwerkopslag. Voor lokale dev gebruiken we hier een named volume
# i.p.v. een host-bind-mount naar /var/lib/graphdb/home — bij een echte Portainer-deploy
# overschrijft de operator dat naar een host-pad (zie README §Productie-afwijkingen).
#
# GraphDB >= 11.2 heeft een INGEBOUWDE MCP-server op /mcp. Er is dus geen aparte MCP-container:
# het nginx'je ervoor (mcp-auth-proxy) doet alleen de bearer-tokencontrole voor toegang van
# buiten en injecteert het GraphDB-service-account.
#
# Het netwerk heet expliciet `graphdb_default`, zodat andere stacks (bwb-import, graph-qa)
# er als extern netwerk op kunnen joinen en GraphDB intern op http://graphdb:7200 bereiken.
# Start deze stack dus vóór de stacks die erop joinen.
#
# Snelstart (lokaal, podman of docker):
#   cd deploy/graphdb && podman compose up -d
#   # of: docker compose up -d
# Env-vars hieronder hebben lokale dev-defaults; overschrijf ze via een .env-bestand in deze map
# of via de shell. Voor productie: zie ADR-0006 (secrets bestandsgebaseerd) — Portainer levert
# deze dan via `secrets:`, niet als platte env-var.

services:
  graphdb:
    image: ontotext/graphdb:11.4.0
    container_name: lex-graphdb
    restart: unless-stopped
    # Docker/Podman's default is 10s en dan SIGKILL — te kort voor GraphDB, dat zijn opslaglaag
    # netjes moet afsluiten. Een halve minuut extra bij het stoppen is goedkoper dan een
    # herstelronde (of een beschadigde index) bij de volgende start.
    stop_grace_period: 90s
    ports:
      - "7200:7200" # workbench-UI + SPARQL + ingebouwde MCP (/mcp)
    environment:
      GDB_JAVA_OPTS: >-
        -Xms1g -Xmx${GRAPHDB_HEAP:-2g}
      # Service-account voor de healthcheck + dezelfde credentials als de auth-proxy en
      # bwb-import gebruiken. GraphDB-security staat aan: zonder deze waarden komt niemand erin.
      GDB_USER: ${GRAPHDB_SVC_USER:-lex}
      GDB_PASSWORD: ${GRAPHDB_SVC_PASSWORD:-lex-dev-wachtwoord}
    volumes:
      - lex-graphdb-data:/opt/graphdb/home
    healthcheck:
      # Met GraphDB-security aan geeft /rest/repositories 401 zonder credentials — de healthcheck
      # zou de container dan onterecht als unhealthy markeren. **curl, geen wget**: GraphDB
      # antwoordt op de 401 met twee auth-challenges, en GNU wget crasht op de tweede zodra hij
      # via --user/--password gaat parsen (SIGABRT). Zie wetsanalyse-ai/deploy/graphdb/README.md
      # voor de volledige uitleg.
      test:
        [
          "CMD-SHELL",
          "curl -fsS -u \"$${GDB_USER}:$${GDB_PASSWORD}\" -o /dev/null http://localhost:7200/rest/repositories",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Bearer-token-authenticatie voor externe toegang tot GraphDB's ingebouwde MCP.
  mcp-auth-proxy:
    image: nginx:alpine
    container_name: lex-mcp-auth-proxy
    restart: unless-stopped
    ports:
      - "8004:8004"
    command:
      - sh
      - -c
      - |
        cat > /etc/nginx/conf.d/mcp.conf << 'ENDOFNGINX'
        map_hash_bucket_size 128;
        server {
            listen 8004;
            location /mcp {
                if ($$http_authorization !~ "^Bearer ${MCP_BEARER_TOKEN:-lex-dev-mcp-token}$$") { return 401; }
                # Clienttoken gecontroleerd -> vervang de header door het GraphDB-service-account.
                # De proxy is het enige pad naar de MCP en injecteert de credentials, zodat de
                # clients (bwb-import, graph-qa) ze niet hoeven te kennen.
                proxy_set_header Authorization "Basic ${GRAPHDB_BASIC:-bGV4OmxleC1kZXYtd2FjaHR3b29yZA==}";
                proxy_pass http://graphdb:7200;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_set_header Host $$host;
                proxy_buffering off;
                proxy_cache off;
                proxy_read_timeout 3600s;
            }
            location / { return 404; }
        }
        ENDOFNGINX
        exec nginx -g 'daemon off;'
    depends_on:
      - graphdb

  # Applicatie-consistente dump, elke nacht. Lokaal grotendeels overbodig maar houdt het
  # mechanisme getest; bij een echte Portainer-deploy plan je 'm vlak vóór de host-back-up.
  graphdb-backup:
    image: alpine:3.21
    container_name: lex-graphdb-backup
    restart: unless-stopped
    depends_on:
      - graphdb
    environment:
      GDB_USER: ${GRAPHDB_SVC_USER:-lex}
      GDB_PASSWORD: ${GRAPHDB_SVC_PASSWORD:-lex-dev-wachtwoord}
    volumes:
      - lex-graphdb-backup:/backup
    command:
      - sh
      - -c
      - |
        apk add --no-cache curl tzdata >/dev/null
        cp /usr/share/zoneinfo/Europe/Amsterdam /etc/localtime
        cat > /usr/local/bin/dump.sh << 'ENDOFDUMP'
        #!/bin/sh
        set -eu
        REPO="$${GRAPHDB_REPOSITORY:-inning}"
        OUT="/backup/$${REPO}-$$(date +%Y%m%d-%H%M).nq.gz"
        # N-Quads houdt de named graphs vast (TriG/Turtle zou contexts verliezen).
        curl -fsS -u "$${GDB_USER}:$${GDB_PASSWORD}" -H 'Accept: application/n-quads' \
          "http://graphdb:7200/repositories/$${REPO}/statements" | gzip -9 > "$$OUT.tmp"
        # Pas hernoemen als de dump compleet is: een afgebroken run laat geen half bestand achter
        # dat er als geldige back-up uitziet.
        mv "$$OUT.tmp" "$$OUT"
        echo "$$(date -Iseconds) dump gereed: $$OUT ($$(wc -c < "$$OUT") bytes)"
        # Retentie: de laatste 7 dumps.
        ls -1t /backup/$${REPO}-*.nq.gz 2>/dev/null | tail -n +8 | xargs -r rm -f
        ENDOFDUMP
        chmod +x /usr/local/bin/dump.sh
        echo '0 3 * * * /usr/local/bin/dump.sh >> /backup/backup.log 2>&1' > /etc/crontabs/root
        echo "backup-cron actief (03:00, retentie 7)"
        exec crond -f -l 8

volumes:
  lex-graphdb-data:
  lex-graphdb-backup:

networks:
  default:
    name: graphdb_default
